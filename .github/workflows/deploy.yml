name: test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # ubuntu-latest 가 Ubuntu 26 으로 바뀌어도 브라우저 의존성 설치가 깨지지 않게 고정
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps ${{ matrix.browser }}
      # tmux 상태 머신 단위 테스트 + 모든 레벨 답안 + 미션 150라운드를 실제 브라우저로 검증
      - run: npm test
        env:
          BROWSER: ${{ matrix.browser }}
      # 영어 화면: 모든 레벨 + 화면에 한글이 남지 않았는지
      - run: npm run test:en
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && matrix.browser == 'chromium'
        with:
          path: dist

  # 같은 키 입력을 실제 Neovim 과 사이트 에디터에 넣고 결과(텍스트·커서·모드)가 같은지 비교
  nvim-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Neovim 0.11.0 설치 (로컬 비교 기준과 같은 버전)
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.11.0/nvim-linux-x86_64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - run: nvim --version | head -1
      - run: npm run test:nvim

  deploy:
    if: github.event_name != 'pull_request'
    needs: [test, nvim-diff]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
